    <path d="M300 245h160" stroke="#aa3027" stroke-width="6"/><path d="m445 229 24 16-24 16" fill="none" stroke="#aa3027" stroke-width="6"/>
    <path d="M715 245h160" stroke="#aa3027" stroke-width="6"/><path d="m860 229 24 16-24 16" fill="none" stroke="#aa3027" stroke-width="6"/>
    <path d="M1015 320v120" stroke="#aa3027" stroke-width="6"/><path d="m999 425 16 24 16-24" fill="none" stroke="#aa3027" stroke-width="6"/>
    <rect x="310" y="465" width="580" height="130" rx="12" fill="#fff" stroke="#b9aa93" stroke-width="2"/>
    <text x="355" y="520" fill="#aa3027" font-size="20" font-weight="700">PORTALES MULTISITIO</text>
    <text x="355" y="560" fill="#52483d" font-size="18">identidad visual · contenido derivado · SEO</text>
    <path d="M900 530H890" stroke="#aa3027" stroke-width="6"/>
