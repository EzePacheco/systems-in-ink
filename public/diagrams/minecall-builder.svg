<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">MineCall: constructor simple de mundo</title>
  <desc id="desc">Diagrama explicativo del catálogo de entidades, placement por celda y persistencia por HTTP.</desc>
  <rect width="1200" height="700" fill="#17130f"/>
  <text x="70" y="82" fill="#f5eddf" font-family="Manrope, sans-serif" font-size="36" font-weight="700">CONSTRUCTOR SIMPLE · DIAGRAMA EXPLICATIVO</text>
  <g font-family="IBM Plex Sans, sans-serif">
    <rect x="70" y="145" width="300" height="430" rx="14" fill="#f5eddf"/>
    <text x="105" y="195" fill="#aa3027" font-size="20" font-weight="700">01 · CATÁLOGO</text>
    <g fill="#d8c9af"><rect x="105" y="235" width="100" height="100" rx="8"/><rect x="230" y="235" width="100" height="100" rx="8"/><rect x="105" y="360" width="100" height="100" rx="8"/><rect x="230" y="360" width="100" height="100" rx="8"/></g>
    <text x="105" y="520" fill="#52483d" font-size="19">Entidad validada</text>
    <path d="M395 360h95" stroke="#c54b3f" stroke-width="6"/><path d="m475 344 24 16-24 16" fill="none" stroke="#c54b3f" stroke-width="6"/>
    <rect x="520" y="145" width="300" height="430" rx="14" fill="#eadcc5"/>
    <text x="555" y="195" fill="#aa3027" font-size="20" font-weight="700">02 · PLACEMENT</text>
    <g stroke="#9e8b72" stroke-width="2"><path d="M560 250h220M560 300h220M560 350h220M560 400h220M560 450h220"/><path d="M585 225v250M635 225v250M685 225v250M735 225v250"/></g>
    <rect x="637" y="302" width="96" height="96" fill="#c54b3f" opacity=".88"/>
    <text x="555" y="520" fill="#52483d" font-size="19">Celda + rotación + escala</text>
    <path d="M845 360h95" stroke="#c54b3f" stroke-width="6"/><path d="m925 344 24 16-24 16" fill="none" stroke="#c54b3f" stroke-width="6"/>
    <rect x="970" y="145" width="160" height="430" rx="14" fill="#aa3027"/>
    <text x="1005" y="195" fill="#fff" font-size="20" font-weight="700">03 · HTTP</text>
    <text x="1005" y="265" fill="#fff" font-size="18">Batch</text><text x="1005" y="295" fill="#fff" font-size="18">validado</text>
    <path d="M1010 350h80v100h-80z" fill="none" stroke="#fff" stroke-width="3"/>
    <path d="M1022 338h56v24h-56z" fill="#fff"/>
    <text x="1005" y="520" fill="#fff" font-size="18">Mundo durable</text>
  </g>
</svg>
