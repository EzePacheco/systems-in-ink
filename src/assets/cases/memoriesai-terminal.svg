<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Terminal de demostración de MemoriesAI</title>
  <desc id="desc">Interfaz de terminal con comandos sintéticos de briefing, evidencia y cierre.</desc>
  <rect width="1440" height="900" rx="28" fill="#080a09"/>
  <rect x="34" y="34" width="1372" height="832" rx="22" fill="#111512" stroke="#4a594d" stroke-width="2"/>
  <rect x="34" y="34" width="1372" height="78" rx="22" fill="#1b211d"/>
  <path d="M34 90h1372v22H34z" fill="#1b211d"/>
  <circle cx="80" cy="73" r="10" fill="#d06355"/>
  <circle cx="114" cy="73" r="10" fill="#d4a84e"/>
  <circle cx="148" cy="73" r="10" fill="#6da36f"/>
  <text x="720" y="82" fill="#aeb8b0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" text-anchor="middle">memoriesai — workspace</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">
    <text x="82" y="168" fill="#d7bc7e">$</text>
    <text x="112" y="168" fill="#eef1eb">memoryctl briefing --project portfolio</text>
    <text x="82" y="214" fill="#8fa391">1. portal.md</text>
    <text x="82" y="250" fill="#8fa391">2. current-handoff.md</text>
    <text x="82" y="286" fill="#8fa391">authority: repository</text>
    <text x="82" y="356" fill="#d7bc7e">$</text>
    <text x="112" y="356" fill="#eef1eb">memoryctl evidence run --gate slice -- npm test</text>
    <text x="82" y="402" fill="#7fd58a">PASS</text>
    <text x="158" y="402" fill="#b9c3bb">exit=0 · evidence recorded</text>
    <text x="82" y="472" fill="#d7bc7e">$</text>
    <text x="112" y="472" fill="#eef1eb">memoryctl record --outcome success</text>
    <text x="82" y="518" fill="#7fd58a">RECORDED</text>
    <text x="218" y="518" fill="#b9c3bb">decision · learning · handoff</text>
    <text x="82" y="588" fill="#d7bc7e">$</text>
    <text x="112" y="588" fill="#eef1eb">memoryctl query "¿qué cambió y por qué?"</text>
    <rect x="82" y="628" width="1276" height="150" rx="14" fill="#171d19" stroke="#344238"/>
    <text x="112" y="678" fill="#d7bc7e">confidence</text>
    <text x="282" y="678" fill="#eef1eb">verified</text>
    <text x="112" y="724" fill="#d7bc7e">source</text>
    <text x="282" y="724" fill="#eef1eb">repository authority</text>
    <text x="112" y="770" fill="#d7bc7e">status</text>
    <text x="282" y="770" fill="#7fd58a">ready for next session</text>
    <text x="82" y="828" fill="#d7bc7e">▌</text>
  </g>
</svg>
