  <rect x="70" y="84" width="1060" height="592" rx="30" fill="#24241f"/>
  <text x="130" y="165" fill="#f2efe6" font-family="Arial, sans-serif" font-size="34" font-weight="700">Cercaya · Evidence Foundation</text>
  <text x="130" y="205" fill="#c9c2b3" font-family="Arial, sans-serif" font-size="20">Privacidad, integridad y autorización contextual</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(130 286)">
