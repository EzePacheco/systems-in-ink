<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Foundation de evidencia privada de Cercaya</title>
  <desc id="desc">Diagrama conceptual con un solicitante, autorización contextual, evidencia privada, auditoría e integridad.</desc>
